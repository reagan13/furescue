services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: furescue
      DB_USER: furescue
      DB_PASS: furescue_pass
      APP_SECRET: change_me_app_secret
      JWT_SECRET: change_me_jwt_secret
      JWT_REFRESH_SECRET: change_me_refresh_secret
      DEVICE_API_KEY: change_me_device_key
      DEVTOOL_KEY: change_me_devtool_key
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:8000
    volumes:
      - uploads:/var/www/html/public/uploads
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: furescue
      MYSQL_USER: furescue
      MYSQL_PASSWORD: furescue_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  uploads:
  mysql_data:
